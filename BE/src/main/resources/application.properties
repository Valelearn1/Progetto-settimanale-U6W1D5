spring.application.name=sinapsi

# ==========================================================
#  CARICAMENTO DI .env
#  Spring Boot non legge i file .env di suo. Questa riga glielo fa fare
#  senza librerie aggiuntive:
#    optional:      se il file non c'e' l'app parte lo stesso (repo appena
#                   clonato, dove esiste solo .env.example)
#    [.properties]  dice a Spring di interpretarlo con la sintassi
#                   chiave=valore, nonostante l'estensione non standard
#  Il percorso e' relativo alla cartella da cui si avvia l'app, cioe' BE/.
# ==========================================================
spring.config.import=optional:file:./.env[.properties]

# ==========================================================
#  DATABASE (PostgreSQL)
#  Il database "Progetto-settimanale-U6W1D5" va creato prima su pgAdmin.
#  I valori reali stanno in BE/.env, che non finisce mai su git.
#  La sintassi ${NOME:default} legge la variabile d'ambiente NOME e,
#  se non c'e', usa il valore dopo i due punti.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Progetto-settimanale-U6W1D5}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: crea e aggiorna le tabelle da solo all'avvio, comodo in sviluppo.
# Da NON usare in produzione: li' servono le migration (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# La sessione JPA si chiude a fine metodo di servizio, non a fine richiesta.
# Evita query nascoste durante la serializzazione, ma obbliga a decidere
# esplicitamente cosa caricare (vedi i FetchType.EAGER su ChatMessage).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Metti a true per vedere le query in console.
spring.jpa.show-sql=false

server.port=8080

# ==========================================================
#  FRONTEND
#  Usato per costruire il link di verifica dentro la mail di registrazione.
# ==========================================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==========================================================
#  SICUREZZA / JWT
#  Il segreto firma i token: chi lo conosce puo' creare token validi.
#  Minimo 32 caratteri, richiesto da HMAC-SHA256.
#  In sviluppo va bene il default; in produzione solo JWT_SECRET.
# ==========================================================
security.jwt.secret=${JWT_SECRET:chiave-di-sviluppo-u6w1d5-cambiami-in-produzione-32+}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ==========================================================
#  MAIL (Gmail SMTP)
#  MAIL_PASSWORD e' una App Password di 16 caratteri generata da Google,
#  NON la password dell'account.
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Mittente mostrato al destinatario
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Cache disattivata in sviluppo: modificando un file in templates/mail/
# il cambiamento ha effetto subito, senza riavviare l'applicazione.
# In produzione va rimessa a true per non rileggere i file a ogni invio.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==========================================================
#  OPENROUTER (suggerimenti di risposta)
#  La chiave NON si scrive qui: si legge dalla variabile d'ambiente
#  OPENROUTER_API_KEY, cosi' non finisce mai dentro a git.
# ==========================================================
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.default-model=nex-agi/nex-n2.5-mini:free
openrouter.model-label=Nex AGI: Nex-N2.5-Mini (free)
# I modelli reasoning possono esaurire i token ragionando senza scrivere la
# risposta finale: per un suggerimento che deve comparire in due secondi
# e' un rischio senza contropartita. Metti a true per sperimentare.
openrouter.reasoning-enabled=false
# Quanti messaggi di cronologia mandare al modello a ogni richiesta.
openrouter.max-history-messages=12
openrouter.app-title=Sinapsi
openrouter.referer=http://localhost:5173
